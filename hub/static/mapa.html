<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de reportes</title>
<link rel="stylesheet" href="/hub/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<main>
  <h1>Mapa de parcelas y avisos</h1>
  <p class="muted small">Cada punto es la parcela de un socio, con el color de su último resultado (30 días). Los círculos rojos son zonas de aviso de roya (radio de 5 km).
    Mapa simple sin internet (sin calles ni relieve). Ubicaciones aproximadas.</p>
  <div class="map-wrap" id="map"></div>
  <p class="legend small" id="legend"></p>
  <div class="row">
    <div class="card grow"><h2 style="margin-top:0">Avisos de brote</h2><div id="alerts" class="small"></div></div>
    <div class="card grow"><h2 style="margin-top:0">Regla del aviso</h2><div id="rule" class="small"></div></div>
  </div>
</main>
<script src="/hub/common.js"></script>
<script>
const W = 960, H = 600, PAD = 50;
function render(d) {
  const pts = d.members.filter((m) => m.lat != null);
  const lats = pts.map((m) => m.lat).concat(d.alerts.map((a) => a.lat));
  const lons = pts.map((m) => m.lon).concat(d.alerts.map((a) => a.lon));
  if (!lats.length) { document.getElementById("map").innerHTML = '<p class="muted" style="padding:12px">No hay parcelas con ubicación.</p>'; return; }
  const r = d.params.outbreak.radius_km;
  let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const mid = (minLat + maxLat) / 2, cos = Math.cos((mid * Math.PI) / 180);
  const padDeg = 2.5 / 111.32;  // 2.5 km margin
  minLat -= padDeg; maxLat += padDeg; minLon -= padDeg / cos; maxLon += padDeg / cos;
  const k = Math.min((W - 2 * PAD) / ((maxLon - minLon) * cos), (H - 2 * PAD) / (maxLat - minLat));  // px per degree of latitude
  const ox = (W - (maxLon - minLon) * cos * k) / 2, oy = (H - (maxLat - minLat) * k) / 2;
  const X = (lon) => ox + (lon - minLon) * cos * k, Y = (lat) => oy + (maxLat - lat) * k;
  const kmPx = k / 111.32;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa de parcelas">`;
  s += `<rect width="${W}" height="${H}" fill="#eef2e8"/>`;
  // light grid every 0.05 degrees
  for (let la = Math.ceil(minLat * 20) / 20; la <= maxLat; la += 0.05)
    s += `<line x1="0" x2="${W}" y1="${Y(la)}" y2="${Y(la)}" stroke="#d7ddd0"/><text x="4" y="${Y(la) - 3}" font-size="10" fill="#8a9384">${la.toFixed(2)}°</text>`;
  for (let lo = Math.ceil(minLon * 20) / 20; lo <= maxLon; lo += 0.05)
    s += `<line y1="0" y2="${H}" x1="${X(lo)}" x2="${X(lo)}" stroke="#d7ddd0"/><text x="${X(lo) + 3}" y="${H - 4}" font-size="10" fill="#8a9384">${lo.toFixed(2)}°</text>`;
  // alert circles
  for (const a of d.alerts) {
    const col = a.active ? "#b3361f" : "#9a9a9a";
    s += `<circle cx="${X(a.lon)}" cy="${Y(a.lat)}" r="${r * kmPx}" fill="${col}" fill-opacity="${a.active ? 0.12 : 0.05}" stroke="${col}" stroke-dasharray="${a.active ? "" : "5 4"}" stroke-width="2"><title>Aviso #${a.id} ${a.active ? "activo" : "vencido"}: ${a.n_reports} socios con roya cerca de ${esc(a.community)}</title></circle>`;
    s += `<text x="${X(a.lon)}" y="${Y(a.lat) - r * kmPx - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">Aviso #${a.id}${a.active ? "" : " (vencido)"}</text>`;
  }
  // community labels at the centroid of their plots
  const comm = {};
  for (const m of pts) { (comm[m.community] = comm[m.community] || []).push(m); }
  for (const [name, ms] of Object.entries(comm)) {
    const cx = ms.reduce((a, m) => a + X(m.lon), 0) / ms.length, cy = Math.min(...ms.map((m) => Y(m.lat))) - 16;
    s += `<text x="${cx}" y="${cy}" text-anchor="middle" font-size="14" font-weight="700" fill="#3c4a40" stroke="#eef2e8" stroke-width="4" paint-order="stroke">${esc(name)}</text>`;
  }
  // plots
  for (const m of pts) {
    const l = m.latest, info = l ? CODE_INFO[l.code] : null;
    const col = info ? info.color : "#b8b8b0";
    const isNoor = m.member_id === "M0123";
    s += `<g><circle cx="${X(m.lon)}" cy="${Y(m.lat)}" r="${isNoor ? 9 : 7}" fill="${col}" stroke="${isNoor ? "#111" : "#fff"}" stroke-width="${isNoor ? 3 : 2}"/>
      <title>${esc(m.member_id)} ${esc(m.name)} — ${l ? esc(info.name) + (["DUDA", "OTRO"].includes(l.code) ? "" : " " + l.conf + "%") + " · " + l.date : "sin reportes en 30 días"}</title></g>`;
    if (isNoor) s += `<text x="${X(m.lon) + 12}" y="${Y(m.lat) + 4}" font-size="12" font-weight="700" fill="#111">Noor</text>`;
  }
  // scale bar
  s += `<g transform="translate(${W - PAD - r * kmPx},${H - 24})"><rect x="-6" y="-16" width="${r * kmPx + 12}" height="24" fill="#fff" fill-opacity=".7"/><line x1="0" x2="${r * kmPx}" y1="0" y2="0" stroke="#333" stroke-width="3"/><text x="${(r * kmPx) / 2}" y="-5" text-anchor="middle" font-size="11">${r} km</text></g>`;
  s += "</svg>";
  document.getElementById("map").innerHTML = s;
}
(async function () {
  await initPage();
  const d = await api("/api/map");
  render(d);
  document.getElementById("legend").innerHTML = Object.entries(CODE_INFO).map(([k, v]) => `<span><span class="dot" style="background:${v.color}"></span>${v.name}</span>`).join("") +
    '<span><span class="dot" style="background:#b8b8b0"></span>Sin reportes (30 días)</span><span><span class="dot" style="background:#fff;border:3px solid #111"></span>Noor</span>' +
    '<span style="color:#b3361f">◯ zona de aviso activa (5 km)</span>';
  document.getElementById("alerts").innerHTML = d.alerts.length ? d.alerts.map((a) =>
    `<p><b>#${a.id} ${a.active ? '<span class="badge unv">activo</span>' : '<span class="badge grey">vencido</span>'}</b> Roya cerca de ${esc(a.community)} · ${a.n_reports} socios ·
     ${fmtDate(a.created_at)}<br><span class="muted">Socios: ${a.member_ids.map(esc).join(", ")} · SMS: ${a.messages.pending_approval || 0} por aprobar,
     ${a.messages.sent_simulated || 0} enviados, ${a.messages.rejected || 0} rechazados</span></p>`).join("") : "No hay avisos.";
  const o = d.params.outbreak;
  document.getElementById("rule").innerHTML = `<p>${o.min_members} o más socios distintos reportan <b>ROYA</b> con confianza ≥ ${o.min_conf}%,
    todos a menos de ${o.radius_km} km entre sí, en los últimos ${o.window_days} días → un aviso (máximo uno por zona cada ${o.one_alert_per_area_days} días).
    El aviso se queda en la bandeja hasta que el personal lo aprueba.</p><p class="muted">${esc(o.note)} No es IA: es una regla fija.</p>`;
})();
</script>
</body>
</html>
